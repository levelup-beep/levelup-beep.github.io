# Netlify: Hauptprojekt fuer levelupladies.de
# Die Landingpage laeuft an der Wurzel, die beiden Workshop-Seiten sind eigene
# Netlify-Projekte (eigene Repos) und werden unter /bildung/ und /workshop/ durchgereicht.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  BASE_PATH = "/"
  NODE_VERSION = "20"

# Workshop-Seiten durchreichen (Adresse bleibt levelupladies.de/...)
[[redirects]]
  from = "/bildung"
  to = "/bildung/"
  status = 301

[[redirects]]
  from = "/bildung/*"
  to = "https://levelupladies-bildung.netlify.app/:splat"
  status = 200

[[redirects]]
  from = "/workshop"
  to = "/workshop/"
  status = 301

[[redirects]]
  from = "/workshop/*"
  to = "https://levelupladies-workshop.netlify.app/:splat"
  status = 200

# Alte GitHub-Pages-Pfade auf die neuen umleiten
[[redirects]]
  from = "/level-up-ladies/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/level_up_ladies/*"
  to = "/bildung/:splat"
  status = 301

[[redirects]]
  from = "/level-up-workshop/*"
  to = "/workshop/:splat"
  status = 301
